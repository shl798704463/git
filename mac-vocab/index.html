<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>词航 · 专业英语</title><link rel="stylesheet" href="style.css"></head><body><aside><div class="logo">词航 <small>LEXICON</small></div><p>让专业表达成为习惯。</p><nav><button data-view="study" class="selected">◈　今日学习</button><button data-view="library">▤　全部词库</button><button data-view="progress">↗　学习进度</button></nav><div class="aside-bottom">离线运行 · 数据保存在此浏览器<br><button id="export">导出学习备份</button><label class="import">导入备份<input id="import" type="file" accept="application/json"></label></div></aside><main><header><div><div class="eyebrow">YOUR DAILY PRACTICE</div><h1 id="heading">今日学习</h1></div><span id="date"></span></header><div id="notice" role="status"></div><div class="filters"><label>词库 <select id="category"><option value="all">全部词库</option><option>商务英语</option><option>AIDC</option><option>电力电子</option></select></label><label>回忆方向 <select id="direction"><option value="en">看英文，忆中文</option><option value="zh">看中文，忆英文</option></select></label></div><section id="stats" class="stats"></section><section id="study"><div class="card"><div class="card-top"><span id="tag"></span><span id="queue"></span></div><div id="question"></div><p class="hint">先回忆，再揭晓。试着说出释义，并造一个句子。</p><label class="recall-label">我的回忆（可选）<textarea id="recall" placeholder="在这里写下你的答案…"></textarea></label><button id="reveal" class="primary">显示答案 <kbd>空格</kbd></button><div id="answer" hidden></div><div id="ratings" hidden><p>这次回忆感觉如何？</p><div class="rating-buttons"><button data-grade="again">重学 <small>10 分钟</small></button><button data-grade="hard">困难 <small id="hard-time"></small></button><button data-grade="good">记住 <small id="good-time"></small></button><button data-grade="easy">轻松 <small id="easy-time"></small></button></div></div></div><p class="footnote">每天一点，积累能在工作中用上的英语。评分后自动安排下一次复习。</p></section><section id="library" hidden><input id="search" type="search" placeholder="搜索英文、中文或例句"><div id="word-list"></div></section><section id="progress" hidden></section></main><script src="words.js"></script><script src="app.js"></script></body></html>
